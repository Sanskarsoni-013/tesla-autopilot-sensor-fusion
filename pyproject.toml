[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tesla-autopilot-sensor-fusion"
version = "1.0.0"
description = "Autonomous Driving Intelligence & Multi-Sensor Perception Engine modeling Tesla Autopilot / FSD architecture."
readme = "README.md"
authors = [
  { name = "Sanskar Soni", email = "sanskar013soni@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24.0",
  "scipy>=1.10.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "matplotlib>=3.7.0"
]

[project.scripts]
tesla-autopilot = "main:main"
